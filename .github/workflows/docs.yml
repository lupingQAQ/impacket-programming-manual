name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      - run: mkdocs build --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages with workflow build type
        run: |
          code=$(curl -s -o /tmp/r1.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}')
          echo "POST /pages -> $code"
          head -c 400 /tmp/r1.json || true
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            code2=$(curl -s -o /tmp/r2.json -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"build_type":"workflow"}')
            echo "PATCH /pages -> $code2"
            head -c 400 /tmp/r2.json || true
            echo "::warning::pages enable POST=$code PATCH=$code2"
          else
            echo "pages enabled (POST=$code)"
          fi
          sleep 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
  deploy:
    needs: [build, enable-pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
